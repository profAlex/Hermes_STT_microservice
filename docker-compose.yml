version: '3.8'

services:
  # 1. Cервис Whisper HTTP Server (C++ / CUDA)
  whisper-server:
    build:
      context: .
      dockerfile: whisper-server.Dockerfile
    container_name: whisper_cuda_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
      - whisper-binaries:/app/binaries # Экспортируем собранные бинарники в volume
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command: >
      -m /models/ggml-medium.bin
      --host 0.0.0.0
      --port 8080
      -l ru
      -bs 1
      --no-fallback

  # 2. Node.js Микросервис (VoiceGateway)
  node-service:
    build:
      context: .
      dockerfile: ./node-service/Dockerfile
    container_name: voice_gateway_service
    restart: unless-stopped
    ports:
      - "${VOICE_GATEWAY_PORT}:${VOICE_GATEWAY_PORT}"
    env_file:
      - ./node-service/.env
    volumes:
      - ./models:/models:ro
      - whisper-binaries:/app/binaries:ro # Подключаем бинарники для CLI Fallback
    depends_on:
      whisper-server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

volumes:
  whisper-binaries:
